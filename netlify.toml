# Static site: `pnpm run build` pre-renders every page into dist/apps/barberos-site/client.
[build]
command = "pnpm run build"
publish = "dist/apps/barberos-site/client"

[dev]
command = "pnpm run start"
targetPort = 3000

[build.environment]
# set TERM variable for terminal output
TERM = "xterm"

[[plugins]]
package = "@netlify/plugin-local-install-core"
