name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel outdated PR runs; an in-progress run on main is not cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Nx Cloud remote cache. Without this secret (always the case on fork PRs),
      # Nx falls back to the token committed in nx.json, which is public and read-write.
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run-many -t lint

      - name: Test
        run: pnpm nx run-many -t test

      - name: Typecheck
        run: pnpm nx run-many -t typecheck

      - name: Build
        run: pnpm nx run-many -t build
